<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }
        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .sidebar-header {
            margin-bottom: 16px;
        }
        .sidebar-header input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .sidebar-header label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .contacts {
            flex: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .contact:hover {
            background: #f0f0f0;
        }
        .contact.active {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 500;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #ddd;
            background: #f9f9f9;
            font-weight: 500;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            display: flex;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent {
            justify-content: flex-end;
        }
        .message.received {
            justify-content: flex-start;
        }
        .message-bubble {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 400px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: #007bff;
            color: white;
        }
        .message.received .message-bubble {
            background: #e9ecef;
            color: #333;
        }
        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .input-area {
            padding: 16px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }
        .input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-area button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .input-area button:hover {
            background: #0056b3;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            height: 100%;
        }
        .setup-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-form {
            background: white;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .setup-form h2 {
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <label for="yourName">Your name</label>
            <input type="text" id="yourName" placeholder="e.g., alice" />
        </div>
        <div class="sidebar-header">
            <label for="chatWith">Chat with</label>
            <input type="text" id="chatWith" placeholder="e.g., bob" />
        </div>
        <button id="startChat" style="padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Start Chat</button>
        <div class="contacts" id="contacts"></div>
    </div>

    <div class="main">
        <div class="chat-header" id="chatHeader" style="display: none;">
            Chat with <span id="chatWithName"></span>
        </div>
        <div class="messages" id="messages"></div>
        <div id="setupPrompt" class="setup-section">
            <div class="setup-form">
                <h2>Welcome</h2>
                <div class="form-group">
                    <label for="setupYourName">Your name</label>
                    <input type="text" id="setupYourName" placeholder="e.g., alice" />
                </div>
                <div class="form-group">
                    <label for="setupChatWith">Chat with</label>
                    <input type="text" id="setupChatWith" placeholder="e.g., bob" />
                </div>
                <div class="form-group">
                    <button id="setupStart">Start Chat</button>
                </div>
            </div>
        </div>
        <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="Type a message..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/10.0.0/signalr.js"></script>
    <script>
        let connection = null;
        let currentUser = null;
        let currentChat = null;

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function initConnection(user) {
            if (connection) {
                await connection.stop();
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl(`/hub/chat?user=${encodeURIComponent(user)}`)
                .withAutomaticReconnect()
                .build();

            connection.on("message", (msg) => {
                if (!currentChat) return;
                const isOwn = msg.from === currentUser;
                addMessageToUI(msg, isOwn);
            });

            connection.onreconnected(() => {
                console.log("Reconnected");
            });

            await connection.start();
            console.log("Connected");
        }

        async function startChat(yourName, chatWith) {
            currentUser = yourName;
            currentChat = chatWith;

            document.getElementById("setupPrompt").style.display = "none";
            document.getElementById("chatHeader").style.display = "block";
            document.getElementById("inputArea").style.display = "flex";
            document.getElementById("chatWithName").textContent = chatWith;
            document.getElementById("messages").innerHTML = "";

            await initConnection(yourName);
            await loadHistory(yourName, chatWith);
        }

        async function loadHistory(user, with_user) {
            const resp = await fetch(`/api/messages?user=${encodeURIComponent(user)}&with=${encodeURIComponent(with_user)}`);
            const messages = await resp.json();
            const container = document.getElementById("messages");
            container.innerHTML = "";
            for (const msg of messages) {
                const isOwn = msg.from === user;
                addMessageToUI(msg, isOwn);
            }
        }

        function addMessageToUI(msg, isOwn) {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${isOwn ? "sent" : "received"}`;
            const time = new Date(msg.sentAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            div.innerHTML = `<div style="display: flex; flex-direction: column; gap: 4px;"><div class="message-bubble">${escapeHtml(msg.body)}</div><div class="message-time">${time}</div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById("startChat").addEventListener("click", () => {
            const yourName = document.getElementById("yourName").value.trim();
            const chatWith = document.getElementById("chatWith").value.trim();
            if (yourName && chatWith) {
                startChat(yourName, chatWith);
            }
        });

        document.getElementById("setupStart").addEventListener("click", () => {
            const yourName = document.getElementById("setupYourName").value.trim();
            const chatWith = document.getElementById("setupChatWith").value.trim();
            if (yourName && chatWith) {
                startChat(yourName, chatWith);
            }
        });

        document.getElementById("sendBtn").addEventListener("click", async () => {
            const input = document.getElementById("messageInput");
            const body = input.value.trim();
            if (!body) return;

            input.value = "";
            if (connection) {
                try {
                    await connection.invoke("Send", currentChat, body);
                } catch (err) {
                    console.error("Send error:", err);
                }
            }
        });

        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                document.getElementById("sendBtn").click();
            }
        });

        // Check if user is already set via query string
        const userFromQuery = getQueryParam("user");
        if (userFromQuery) {
            document.getElementById("yourName").value = userFromQuery;
        }
    </script>
</body>
</html>
